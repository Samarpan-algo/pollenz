server:
  port: ${PORT:8080}

spring:
  application:
    name: pollenz-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pollenz}
    username: ${DB_USER:pollenz}
    password: ${DB_PASSWORD:pollenz}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

pollenz:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt:
    # DEV ONLY default. Always set JWT_SECRET (>= 32 bytes) in any shared or production environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    expiry-hours: 24
  scheduling:
    # Integration tests set this to false and call the jobs directly.
    enabled: true
  pools:
    # How often the expiry job looks for OPEN pools past closes_at.
    expiry-interval-ms: 60000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
